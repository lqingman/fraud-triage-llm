# Phase 5 — CI. Every push/PR runs the full pytest suite (schema, data,
# training helpers, eval metrics, serving/guardrails, MLflow) plus an
# eval-regression gate against a committed synthetic fixture
# (tests/fixtures/ci_eval/), which FAILS the build if F1 / PR-AUC /
# JSON-validity drop below config/config.yaml thresholds.
#
# Scope note: this gate proves the mechanism runs on every push — it does not
# re-derive the real model's headline numbers (0.941 F1 / 0.937 PR-AUC), since
# those require a GPU + the trained adapter, which don't exist in CI. That
# real result is a manually-verified Kaggle artifact (reports/metrics.json).
# See docs/devlog/phase-5-ci-gate.md.

name: eval

on: [push, pull_request]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (lightweight, CPU-only for CI)
        run: |
          pip install -r requirements-base.txt
      - name: Full test suite
        run: pytest -q
      - name: Eval-regression gate (synthetic CI fixture)
        run: |
          python -m src.eval.evaluate \
            --data tests/fixtures/ci_eval \
            --predictions tests/fixtures/ci_eval/predictions.jsonl \
            --metrics-out /tmp/ci_metrics.json \
            --baseline-out /tmp/ci_baseline.joblib
      - name: Responsible AI regression gate
        run: |
          python -m src.eval.responsible_ai \
            --cases tests/fixtures/ci_eval/responsible_ai_cases.jsonl \
            --out /tmp/ci_responsible_ai.json
      - name: Multi-signal promotion gate
        run: |
          python -m src.eval.promotion \
            --metrics /tmp/ci_metrics.json \
            --operational-metrics tests/fixtures/ci_eval/operational_metrics.json \
            --responsible-ai /tmp/ci_responsible_ai.json \
            --out /tmp/ci_promotion_decision.json
